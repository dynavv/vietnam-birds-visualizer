<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Archival Circle Background -->
  <circle cx="32" cy="32" r="30" fill="#FAF8F5" stroke="#2D5A27" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="26" stroke="#D97706" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Botanical Branch -->
  <path d="M12 46 C 24 44, 40 43, 54 41" stroke="#854D0E" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="22" cy="43" rx="2.5" ry="4" transform="rotate(-35 22 43)" fill="#166534" />
  <ellipse cx="44" cy="41" rx="2" ry="3.5" transform="rotate(30 44 41)" fill="#166534" />

  <!-- Bird Tail -->
  <path d="M22 36 C 16 42, 12 48, 10 52 C 16 48, 22 43, 26 38 Z" fill="#2D5A27" />

  <!-- Bird Body -->
  <ellipse cx="33" cy="33" rx="9" ry="11" transform="rotate(-25 33 33)" fill="#2D5A27" />
  
  <!-- Golden Breast Highlight -->
  <path d="M28 29 C 31 25, 39 26, 41 32 C 39 37, 31 39, 27 35 Z" fill="#D97706" />

  <!-- Wing Feather -->
  <path d="M27 31 C 25 36, 23 42, 21 46 C 26 44, 32 38, 34 34 Z" fill="#15803D" />

  <!-- Head & Crown -->
  <circle cx="41" cy="23" r="6.5" fill="#2D5A27" />
  <path d="M38 18 C 39 15, 42 13, 44 15 C 43 17, 42 19, 41 20 Z" fill="#D97706" />

  <!-- Eye -->
  <circle cx="43" cy="22" r="1.8" fill="#FFFFFF" />
  <circle cx="43.3" cy="22" r="1" fill="#1C1917" />
  <circle cx="43.6" cy="21.7" r="0.35" fill="#FFFFFF" />

  <!-- Beak -->
  <path d="M46.5 22 L 53 23.5 L 46.5 25 Z" fill="#D97706" stroke="#854D0E" stroke-width="0.5" />

  <!-- Feet -->
  <path d="M31 42 L 31 46 M 33 42 L 34 45.5" stroke="#44403C" stroke-width="1.2" stroke-linecap="round" />
</svg>
